<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<header class="w-full top-0 bg-surface dark:bg-surface-dim flat no shadows z-40 relative">
<div class="flex items-center justify-between px-6 py-4 w-full h-[64px]">
<button onclick="window.history.back()" aria-label="Go back" class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high transition-colors active:scale-95 transition-transform p-2 rounded-full -ml-2 flex items-center justify-center focus:outline-none">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile dark:text-on-surface text-center flex-1 pr-[40px]">Talkie Talkie</h1>
</div>
</header>

<main class="flex-1 px-container-margin py-stack-gap-lg flex flex-col items-center w-full max-w-md mx-auto relative z-10">
<div class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-low mb-6 border border-outline-variant shadow-sm">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>

<div class="text-center w-full mb-8">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2"></h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to your account to continue</p>
</div>

<div class="w-full bg-surface-container-lowest rounded-xl p-6 border border-surface-variant shadow-sm login-card">
<!-- Password Portal Form -->
<form id="login-form" class="space-y-stack-gap-md">
<div class="flex flex-col gap-1 w-full">
<label class="font-label-caps text-label-caps text-on-surface-variant pl-1" for="username-input">Username Email </label>
<div class="relative input-glow rounded-lg">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant z-10 pointer-events-none">person</span>
<input class="w-full bg-[#F1F5F9] focus:bg-white text-on-surface border border-transparent focus:border-outline-variant rounded-lg p-input-padding pl-11 transition-colors font-body-lg text-body-lg outline-none placeholder:text-outline" id="username-input" placeholder="Username" type="text" required>
</div>
</div>
<div class="flex flex-col gap-1 w-full">
<label class="font-label-caps text-label-caps text-on-surface-variant pl-1" for="password-input">Password</label>
<div class="relative input-glow rounded-lg">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant z-10 pointer-events-none">lock</span>
<input class="w-full bg-[#F1F5F9] focus:bg-white text-on-surface border border-transparent focus:border-outline-variant rounded-lg p-input-padding pl-11 pr-11 transition-colors font-body-lg text-body-lg outline-none placeholder:text-outline" id="password-input" placeholder="••••••••" type="password" required>
<button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" onclick="togglePassword()">
<span class="material-symbols-outlined" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>

<button type="submit" class="w-full bg-primary text-on-primary font-button-text text-button-text h-[52px] rounded-lg mt-stack-gap-lg flex items-center justify-center gap-2 hover:bg-primary-container active:scale-[0.98] transition-all focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" id="submit-btn">
    <span>Sign In</span>
    <span class="material-symbols-outlined text-sm" id="submit-icon">login</span>
</button>
</form>
</div>

<div class="mt-8 flex flex-col items-center gap-stack-gap-sm w-full">
<a href="/signup.html" class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors bg-transparent border-none p-2 rounded focus:outline-none">
    Don't have an account? <span class="font-semibold text-primary">Sign up</span>
</a>
<button type="button" class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors bg-transparent border-none p-2 rounded focus:outline-none">
    Problem signing in?
</button>
</div>
</main>

<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password-input');
            const toggleIcon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }

        // Login Handler with Session Token Handling
        
    </script>
    <script type="module" src="./login.js"></script>
</body>
