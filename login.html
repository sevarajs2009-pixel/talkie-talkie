<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Talkie Talkie - Log In</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Quicksand", sans-serif;
      background: #e8edf3;
      color: #1f2937;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .clay-card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 32px;
      box-shadow:
        14px 14px 30px rgba(163, 177, 198, 0.45),
        -10px -10px 24px rgba(255, 255, 255, 0.9);
    }

    .clay-button {
      border-radius: 18px;
      box-shadow:
        7px 7px 15px rgba(163, 177, 198, 0.4),
        -6px -6px 14px rgba(255, 255, 255, 0.9);
      transition: all 0.2s ease;
    }

    .clay-button:hover {
      transform: translateY(-2px);
    }

    .clay-button:active {
      transform: translateY(1px);
      box-shadow:
        3px 3px 8px rgba(163, 177, 198, 0.35),
        -3px -3px 8px rgba(255, 255, 255, 0.8);
    }
    

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
    }

    .blob-one {
      width: 220px;
      height: 220px;
      background: #c7d2fe;
      top: -70px;
      left: -70px;
    }

    .blob-two {
      width: 260px;
      height: 260px;
      background: #bae6fd;
      right: -90px;
      bottom: -90px;
    }

    .equalizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: #f8fafc;
      box-shadow:
        inset 4px 4px 9px rgba(163, 177, 198, 0.28),
        inset -4px -4px 9px rgba(255, 255, 255, 0.95),
        8px 8px 18px rgba(163, 177, 198, 0.28);
    }

    .equalizer {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;

  width: 78px;
  height: 78px;

  border-radius: 26px;

  background: linear-gradient(
    145deg,
    #ffffff,
    #eef2ff
  );

  box-shadow:
    10px 10px 22px rgba(163, 177, 198, 0.38),
    -8px -8px 20px rgba(255, 255, 255, 0.95),
    inset 2px 2px 5px rgba(255,255,255,0.9);

  overflow: hidden;

  transition:
    transform 0.45s cubic-bezier(.2,.8,.2,1),
    box-shadow 0.45s ease;
}

/* Soft animated glow behind the bars */
.equalizer::before {
  content: "";
  position: absolute;
  width: 58px;
  height: 58px;
  border-radius: 50%;

  background: radial-gradient(
    circle,
    rgba(79,70,229,0.18),
    rgba(6,182,212,0.08),
    transparent 70%
  );

  animation: logoPulse 2.2s ease-in-out infinite;
}

/* Equalizer bars */
.equalizer span {
  position: relative;
  z-index: 2;

  width: 6px;
  border-radius: 999px;

  background: linear-gradient(
    to top,
    #4f46e5,
    #6366f1,
    #06b6d4
  );

  transform-origin: center;

  box-shadow:
    0 0 8px rgba(79,70,229,0.25);

  animation: voiceBars 1.15s ease-in-out infinite;
}

/* Different heights + timing = natural voice movement */
.equalizer span:nth-child(1) {
  height: 20px;
  animation-delay: -0.15s;
}

.equalizer span:nth-child(2) {
  height: 34px;
  animation-delay: -0.35s;
}

.equalizer span:nth-child(3) {
  height: 48px;
  animation-delay: -0.55s;
}

.equalizer span:nth-child(4) {
  height: 35px;
  animation-delay: -0.30s;
}

.equalizer span:nth-child(5) {
  height: 21px;
  animation-delay: -0.10s;
}

/* Voice waveform */
@keyframes voiceBars {
  0%,
  100% {
    transform: scaleY(0.55);
  }

  50% {
    transform: scaleY(1);
  }
}

/* Soft breathing glow */
@keyframes logoPulse {
  0%,
  100% {
    transform: scale(0.85);
    opacity: 0.45;
  }

  50% {
    transform: scale(1.08);
    opacity: 0.9;
  }
}

/* Hover interaction */
.equalizer:hover {
  transform:
    translateY(-6px)
    scale(1.06)
    rotate(-2deg);

  box-shadow:
    12px 14px 28px rgba(163,177,198,0.42),
    -9px -9px 22px rgba(255,255,255,0.98),
    0 0 30px rgba(79,70,229,0.18);
}

.equalizer:hover span {
  animation-duration: 0.65s;
}

    .equalizer span:nth-child(1) {
      height: 18px;
    }

    .equalizer span:nth-child(2) {
      height: 32px;
    }

    .equalizer span:nth-child(3) {
      height: 44px;
    }

    .equalizer span:nth-child(4) {
      height: 27px;
    }

    .equalizer span:nth-child(5) {
      height: 16px;
    }

    /* ================================
   TALKIE TALKIE BRAND
   Hover-only premium animation
   ================================ */

.brand-title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: default;
  perspective: 600px;
}

.brand-talkie {
  position: relative;
  display: inline-block;

  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;

  background: linear-gradient(
    120deg,
    #4f46e5,
    #7c3aed,
    #2563eb,
    #4f46e5
  );

  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  transition:
    transform 0.45s cubic-bezier(.2,.8,.2,1),
    filter 0.45s ease,
    letter-spacing 0.45s ease;
}

/* Second Talkie starts slightly different */
.brand-talkie-second {
  transition-delay: 0.04s;
}

/* Small shine line */
.brand-talkie::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -7px;

  width: 0;
  height: 3px;

  border-radius: 999px;

  background: linear-gradient(
    90deg,
    #4f46e5,
    #7c3aed,
    #2563eb
  );

  box-shadow: 0 0 10px rgba(79, 70, 229, 0.35);

  transition:
    width 0.45s cubic-bezier(.2,.8,.2,1);
}

/* Animated gradient */
@keyframes brandGradient {
  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}

/* ================================
   HOVER EFFECT
   ================================ */

.brand-title:hover .brand-talkie {
  transform:
    translateY(-4px)
    scale(1.08);

  filter:
    drop-shadow(0 8px 14px rgba(79, 70, 229, 0.20));

  letter-spacing: -0.02em;

  animation:
    brandGradient 2s ease infinite;
}

.brand-title:hover .brand-talkie-second {
  transform:
    translateY(-7px)
    scale(1.11)
    rotate(-1deg);
}

.brand-title:hover .brand-talkie::after {
  width: 100%;
}

/* Slightly stronger effect when hovering the whole brand */
.brand-title:hover {
  transform: translateY(-1px);
}

    .google-icon {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  transition: transform 0.45s cubic-bezier(.2,.8,.2,1);
}

/* Google button */
#google-login-button {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  cursor: pointer;
}

/* Moving light */
#google-login-button::before {
  content: "";
  position: absolute;
  top: 0;
  left: -120%;
  width: 70%;
  height: 100%;
  background: linear-gradient(
    110deg,
    transparent,
    rgba(255,255,255,0.85),
    transparent
  );
  transform: skewX(-20deg);
  transition: left 0.7s ease;
  z-index: -1;
}

/* Soft Google-colored glow */
#google-login-button::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 20px;
  background: linear-gradient(
    90deg,
    #4285f4,
    #34a853,
    #fbbc05,
    #ea4335,
    #4285f4
  );
  background-size: 300% 100%;
  opacity: 0;
  z-index: -2;
  filter: blur(10px);
  transition: opacity 0.35s ease;
}

/* Hover */
#google-login-button:hover {
  transform: translateY(-4px) scale(1.015);

  box-shadow:
    10px 12px 24px rgba(163, 177, 198, 0.42),
    -7px -7px 18px rgba(255,255,255,0.95),
    0 0 24px rgba(66,133,244,0.18);

  border-color: rgba(66,133,244,0.25);
}

#google-login-button:hover::before {
  left: 140%;
}

#google-login-button:hover::after {
  opacity: 0.45;
  animation: googleGlow 3s linear infinite;
}

#google-login-button:hover .google-icon {
  transform: rotate(-8deg) scale(1.12);
}

/* Text animation */
#google-login-button:hover #btnText {
  letter-spacing: 0.02em;
}

/* Click */
#google-login-button:active {
  transform: translateY(-1px) scale(0.99);
}

/* Animated Google-color glow */
@keyframes googleGlow {
  0% {
    background-position: 0% 50%;
  }

  100% {
    background-position: 300% 50%;
  }
}

/* Loading state */
#google-login-button:disabled {
  cursor: wait;
  transform: none;
  opacity: 0.75;
}

    @media (max-width: 480px) {
      .clay-card {
        border-radius: 26px;
      }
    }
    /* Create Account hover effect */
.create-account-link {
  position: relative;
  display: inline-block;
  color: #4f46e5;
  text-decoration: none;
  transition:
    transform 0.3s cubic-bezier(.2,.8,.2,1),
    color 0.3s ease,
    letter-spacing 0.3s ease;
}

.create-account-link::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -3px;
  width: 0;
  height: 2px;
  border-radius: 999px;
  background: linear-gradient(90deg, #4f46e5, #7c3aed);
  transition: width 0.3s cubic-bezier(.2,.8,.2,1);
}

.create-account-link:hover {
  transform: translateY(-2px);
  color: #7c3aed;
  letter-spacing: 0.02em;
}

.create-account-link:hover::after {
  width: 100%;
}

.create-account-link:active {
  transform: translateY(0) scale(0.97);
}
  </style>
</head>

<body class="flex items-center justify-center px-5 py-10">

  <div class="blob blob-one"></div>
  <div class="blob blob-two"></div>

  <main class="relative z-10 w-full max-w-md">

    <section class="clay-card p-7 sm:p-9">

      <!-- Logo -->
      <div class="flex justify-center mb-7">
        <div class="equalizer" aria-label="Talkie Talkie logo">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>

      <!-- Brand -->
      <div class="text-center">
        <p class="text-sm font-bold tracking-[0.25em] uppercase text-indigo-500">
          Talkie Talkie
        </p>

        <h1 class="mt-3 text-3xl sm:text-4xl font-bold text-gray-800">
          Welcome Back
        </h1>

        <p class="mt-3 text-gray-500 text-sm sm:text-base leading-relaxed">
          Log in instantly with your Google account.
        </p>
      </div>

      <!-- Google Login -->
      <div class="mt-8">

        <button
          id="google-login-button"
          type="button"
          class="clay-button w-full min-h-[58px] bg-white px-5 py-4 flex items-center justify-center gap-3 font-bold text-gray-700 border border-gray-100"
        >

          <svg
            class="google-icon"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill="#4285F4"
              d="M21.35 12.23c0-.79-.07-1.55-.23-2.27H12v4.3h5.22a4.46 4.46 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.93-4.18 2.93-7.39z"
            />
            <path
              fill="#34A853"
              d="M12 21.75c2.63 0 4.84-.87 6.45-2.36l-3.14-2.43c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.51A9.74 9.74 0 0 0 12 21.75z"
            />
            <path
              fill="#FBBC05"
              d="M6.53 13.85A5.86 5.86 0 0 1 6.22 12c0-.64.11-1.26.31-1.85V7.64H3.29A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.06 1.04 4.36l3.24-2.51z"
            />
            <path
              fill="#EA4335"
              d="M12 6.12c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.22 14.63 2.25 12 2.25a9.74 9.74 0 0 0-8.71 5.39l3.24 2.51C7.3 7.84 9.46 6.12 12 6.12z"
            />
          </svg>

          <span id="btnText">
            Continue with Google
          </span>

          <span
            id="spinner"
            class="hidden w-5 h-5 border-2 border-gray-300 border-t-indigo-500 rounded-full animate-spin"
          ></span>

        </button>

      </div>

      <!-- Terms -->
      <p class="mt-7 text-center text-xs text-gray-400 leading-relaxed">
        By continuing, you agree to our
        <a href="#" class="text-indigo-500 hover:underline">Terms</a>
        and
        <a href="#" class="text-indigo-500 hover:underline">Privacy Policy</a>.
      </p>

      <!-- Signup -->
      <div class="mt-7 pt-6 border-t border-gray-100 text-center">

        <p class="text-sm text-gray-500">
          New to Talkie Talkie?
          <a href="./index.html" class="create-account-link">
  <strong>Create Account</strong>
</a>
        </p>

      </div>

    </section>

    <p class="text-center text-xs text-gray-400 mt-6">
      Talkie Talkie • Live voice conversations
    </p>

  </main>

  <!-- IMPORTANT: Existing Firebase login logic -->
  <script type="module" src="./login.js"></script>

</body>
</html>
