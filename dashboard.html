<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>TALKIE TALKIE - Modern Dashboard</title>
  
  <!-- Load React, ReactDOM, & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            dark: {
              900: '#090d16',
              800: '#111827',
              700: '#1f2937',
              600: '#374151',
              border: '#2a3447'
            }
          }
        },
      },
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  </style>
</head>
<body class="bg-dark-900 text-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="module">
  import { auth } from "./firebase.js";

  import {
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs,
  setDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import { app } from "./firebase.js";

const db = getFirestore(app);

window.firebaseDb = db;
window.firebaseDoc = doc;
window.firebaseGetDoc = getDoc;
window.firebaseCollection = collection;
window.firebaseGetDocs = getDocs;
window.firebaseSetDoc = setDoc;
window.firebaseDeleteDoc = deleteDoc;

  window.firebaseAuth = auth;
  window.firebaseOnAuthStateChanged = onAuthStateChanged;
  window.firebaseSignOut = signOut;
</script>

  <script type="text/babel">
    
    function App() {
      // Logged-in User Data State
      const [loggedInUser, setLoggedInUser] = React.useState('');
      const [loggedInEmail, setLoggedInEmail] = React.useState('');
      const [clientIp, setClientIp] = React.useState('Fetching IP...');

      // Profile Data State - Loaded from Firebase Firestore
      const [profileData, setProfileData] = React.useState({
  photo: '',
  fullName: '',
  age: '',
  gender: '',
  country: ''
});
      // Verify Firebase session and load user profile data
      React.useEffect(() => {
        if (!window.firebaseAuth || !window.firebaseOnAuthStateChanged) {
  console.error("Firebase Auth is not loaded.");
  return;
}

const unsubscribe = window.firebaseOnAuthStateChanged(
  window.firebaseAuth,
  (user) => {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }

  setLoggedInEmail(user.email || '');

  console.log("Firebase user:", user.uid);

  // Load profile from Firestore
  
  window.firebaseGetDoc(
  window.firebaseDoc(window.firebaseDb, "users", user.uid)
)
    .then((profileSnapshot) => {
      if (profileSnapshot.exists()) {
        const profile = profileSnapshot.data();

        console.log("Firestore profile:", profile);

        setLoggedInUser(profile.username || '');
setLoggedInEmail(profile.email || user.email || '');

setProfileData((prev) => ({
  ...prev,
  fullName: profile.fullName || prev.fullName,
  age: profile.age || prev.age,
  gender: profile.gender || prev.gender,
  country: profile.country || prev.country
}));
      } else {
        console.log("No Firestore profile found.");
      }
    })
    .catch((error) => {
      console.error("Error loading Firestore profile:", error);
    });
}
);

        // Fetch user profile data from Firebase Firestore
        
      }, []);

      const [activeTab, setActiveTab] = React.useState('home');
      const [isNewRoomModalOpen, setIsNewRoomModalOpen] = React.useState(false);
      
      const [activeActionModal, setActiveActionModal] = React.useState(null); 
      const [actionFormData, setActionFormData] = React.useState({ username: '', email: '', roomId: '', secureKey: '' });
      
      // Payment Modal State for extra room fee ($1)
      const [isPaymentModalOpen, setIsPaymentModalOpen] = React.useState(false);
      const [pendingRoomPayload, setPendingRoomPayload] = React.useState(null);

      // Admin Gateway State Modal & Form Data
      const [isAdminGatewayOpen, setIsAdminGatewayOpen] = React.useState(false);
      const [adminGatewayData, setAdminGatewayData] = React.useState({ adminName: '', roomId: '', secureKey: '' });
      const [adminGatewayStatus, setAdminGatewayStatus] = React.useState('');

      

      // Fetch client IP address on load
      React.useEffect(() => {
        fetch('https://api.ipify.org?format=json')
          .then(res => res.json())
          .then(data => setClientIp(data.ip))
          .catch(() => setClientIp('127.0.0.1 (Local)'));
      }, []);

      // Firebase Logout
const handleLogout = async () => {
  try {
    await window.firebaseSignOut(window.firebaseAuth);

    setLoggedInUser('');
    setLoggedInEmail('');

    window.location.href = 'login.html';
  } catch (error) {
    console.error("Firebase logout error:", error);
    alert("Logout failed. Please try again.");
  }
};

      // Guest Instant Join State
      const [guestJoinData, setGuestJoinData] = React.useState({ roomId: '', secureKey: '' });
      const [guestJoinStatus, setGuestJoinStatus] = React.useState('');

      // Coupon Code State in Payment Portal
      const [couponCode, setCouponCode] = React.useState('');
      const [couponStatus, setCouponStatus] = React.useState('');
      const [discountApplied, setDiscountApplied] = React.useState(false);

      // Support Modal State
      const [isSupportOpen, setIsSupportOpen] = React.useState(false);
      const [supportForm, setSupportForm] = React.useState({ subject: '', message: '' });
      const [supportSubmitted, setSupportSubmitted] = React.useState(false);

      // Enhancements State
      const [searchQueryRooms, setSearchQueryRooms] = React.useState('');
      const [searchQueryHistory, setSearchQueryHistory] = React.useState('');
      const [isNotificationsOpen, setIsNotificationsOpen] = React.useState(false);
      const [notifications, setNotifications] = React.useState([
        { id: 1, text: 'Welcome to Talkie Talkie! Your dashboard is active.', time: 'Just now', unread: true }
      ]);
      const [participantsModalRoom, setParticipantsModalRoom] = React.useState(null);
      const [copyToast, setCopyToast] = React.useState('');

      // Manage Modal State
      const [managingRoom, setManagingRoom] = React.useState(null);

      // Managed Rooms Directory State
const [managedRooms, setManagedRooms] = React.useState([]);

const [roomHistory, setRoomHistory] = React.useState([]);

// Load rooms after Firebase confirms the logged-in user
React.useEffect(() => {
  if (!window.firebaseAuth || !window.firebaseOnAuthStateChanged) {
    console.error("Firebase Auth is not available.");
    return;
  }

  const unsubscribe = window.firebaseOnAuthStateChanged(
    window.firebaseAuth,
    async (user) => {
      if (!user) {
        console.log("No Firebase user is logged in.");
        return;
      }

      try {
        console.log("Loading rooms from Firestore for:", user.uid);

        const roomsRef = window.firebaseCollection(
          window.firebaseDb,
          "users",
          user.uid,
          "managedRooms"
        );

        const roomsSnapshot = await window.firebaseGetDocs(roomsRef);

        const rooms = roomsSnapshot.docs.map((roomDoc) => ({
          ...roomDoc.data()
        }));

        setManagedRooms(rooms);

        console.log("Managed rooms loaded:", rooms);

        const historyRef = window.firebaseCollection(
          window.firebaseDb,
          "users",
          user.uid,
          "roomHistory"
        );

        const historySnapshot = await window.firebaseGetDocs(historyRef);

        const history = historySnapshot.docs.map((historyDoc) => ({
          ...historyDoc.data()
        }));

        setRoomHistory(history);

        console.log("Room history loaded:", history);

      } catch (error) {
        console.error("Error loading rooms from Firestore:", error);
      }
    }
  );

  return () => unsubscribe();
}, []);
      const [newRoomData, setNewRoomData] = React.useState({ name: '', type: 'Family', status: 'Active', secureKey: '', email: loggedInEmail });

      // Update newRoomData email when loggedInEmail updates
      React.useEffect(() => {
        setNewRoomData(prev => ({ ...prev, email: loggedInEmail }));
      }, [loggedInEmail]);

      // Calculate current user counts for Family and Business rooms created by loggedInUser
      const userFamilyRoomsCount = managedRooms.filter(r => loggedInUser && r.userName.toLowerCase() === loggedInUser.toLowerCase() && r.type === 'Family').length;
      const userBusinessRoomsCount = managedRooms.filter(r => loggedInUser && r.userName.toLowerCase() === loggedInUser.toLowerCase() && r.type === 'Business').length;

      // Core Room Creation processor with free allowance check
      const processRoomCreation = (username, email, type, roomName, roomId, secureKey) => {
        const currentFamilyCount = managedRooms.filter(r => r.userName.toLowerCase() === username.toLowerCase() && r.type === 'Family').length;
        const currentBizCount = managedRooms.filter(r => r.userName.toLowerCase() === username.toLowerCase() && r.type === 'Business').length;

        const isExceeding = (type === 'Family' && currentFamilyCount >= 1) || (type === 'Business' && currentBizCount >= 1);

        const roomObj = {
          userName: username,
          email: email.trim(),
          name: roomName,
          roomId: roomId.trim(),
          secureKey: secureKey.trim(),
          status: 'Active',
          members: 1,
          type: type,
          participants: [username],
          ipAddress: clientIp,
          createdAt: new Date().toLocaleString()
        };

        if (isExceeding) {
          setActiveActionModal(null); // Closes the Create Room modal immediately so payment modal is visible
          setPendingRoomPayload(roomObj);
          setIsPaymentModalOpen(true);
          return;
        }

        finalizeRoomCreation(roomObj);
      };

      
        const finalizeRoomCreation = async (roomObj) => {
  try {
    const user = window.firebaseAuth?.currentUser;

    if (!user) {
      alert("You must be logged in.");
      return;
    }

    // Save managed room to Firestore
    await window.firebaseSetDoc(
      window.firebaseDoc(
        window.firebaseDb,
        "users",
        user.uid,
        "managedRooms",
        roomObj.roomId
      ),
      roomObj
    );

  // Publish room to the global room directory
await window.firebaseSetDoc(
  window.firebaseDoc(
    window.firebaseDb,
    "rooms",
    roomObj.roomId
  ),
  {
    roomId: roomObj.roomId,
    name: roomObj.name,
    type: roomObj.type,
    status: roomObj.status,
    members: roomObj.members,
    ownerUid: user.uid,
    userName: roomObj.userName,
    createdAt: roomObj.createdAt
  }
);

    const historyObj = {
      id: Date.now(),
      userName: roomObj.userName,
      email: roomObj.email,
      name: roomObj.name,
      roomId: roomObj.roomId,
      secureKey: roomObj.secureKey,
      status: "Active",
      time: new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        month: "short",
        day: "numeric"
      }),
      ipAddress: clientIp,
      archived: false
    };

    // Save room history to Firestore
    await window.firebaseSetDoc(
      window.firebaseDoc(
        window.firebaseDb,
        "users",
        user.uid,
        "roomHistory",
        String(historyObj.id)
      ),
      historyObj
    );

    // Update screen
    setManagedRooms(prev => {
      if (
        prev.some(
          r => r.roomId.toLowerCase() === roomObj.roomId.toLowerCase()
        )
      ) {
        return prev.map(
          r =>
            r.roomId.toLowerCase() === roomObj.roomId.toLowerCase()
              ? roomObj
              : r
        );
      }

      return [roomObj, ...prev];
    });

    setRoomHistory(prev => [historyObj, ...prev]);

    setActiveActionModal(null);
    setIsNewRoomModalOpen(false);
    setCopyToast("Room created successfully!");

    setTimeout(() => setCopyToast(""), 3000);

    console.log("Room saved to Firebase:", roomObj.roomId);
    console.log("Room history saved to Firebase:", historyObj.id);

  } catch (error) {
    console.error("Error saving room to Firestore:", error);
    alert("Room creation failed: " + error.message);
  }
};
      const handleCreateRoomWithDetails = (e) => {
        e.preventDefault();
        const finalUsername = loggedInUser || actionFormData.username;
        const finalEmail = loggedInEmail || actionFormData.email;
        if (!finalUsername || !finalEmail || !actionFormData.roomId || !actionFormData.secureKey) return;

        const exactRoomName = actionFormData.roomId.trim();
        const generatedId = Math.random().toString(36).substring(2, 9).toUpperCase();
        const roomId = `${activeActionModal === 'Family' ? 'FML' : 'BIZ'}-${generatedId}`;

        processRoomCreation(finalUsername, finalEmail, activeActionModal, exactRoomName, roomId, actionFormData.secureKey);
      };

      const handleCreateRoom = (e) => {
        e.preventDefault();
        const finalUsername = loggedInUser || 'Host';
        const finalEmail = loggedInEmail || newRoomData.email;
        if (!newRoomData.name || !newRoomData.secureKey || !finalEmail) return;

        const generatedId = Math.random().toString(36).substring(2, 9).toUpperCase();
        const type = newRoomData.type || 'Family';
        const exactRoomName = newRoomData.name.trim();
        const roomId = `${type === 'Family' ? 'FML' : 'BIZ'}-${generatedId}`;

        processRoomCreation(finalUsername, finalEmail, type, exactRoomName, roomId, newRoomData.secureKey);
      };

      const handleDeleteRoom = (historyId) => {
        setRoomHistory(prev => prev.filter(item => item.id !== historyId));
      };

      const handleAdminGatewayJoin = (e) => {
        e.preventDefault();
        if (!adminGatewayData.adminName || !adminGatewayData.roomId || !adminGatewayData.secureKey) return;

        setAdminGatewayStatus(`Verifying admin credentials for ${adminGatewayData.adminName}...`);
        
        setTimeout(() => {
          const targetRoom = managedRooms.find(r => r.name.trim().toLowerCase() === adminGatewayData.roomId.trim().toLowerCase() || r.roomId.trim().toLowerCase() === adminGatewayData.roomId.trim().toLowerCase());

          if (!targetRoom) {
            setAdminGatewayStatus('Error: ROOM NAME not found in directory.');
            return;
          }

          if (targetRoom.secureKey !== adminGatewayData.secureKey.trim()) {
            setAdminGatewayStatus('Error: Invalid ROOM ID passcode.');
            return;
          }

          setAdminGatewayStatus(`Admin verified! Launching secure voice room...`);
          
          setTimeout(() => {
            window.location.href = `room.html?roomId=${encodeURIComponent(targetRoom.roomId)}&roomName=${encodeURIComponent(targetRoom.name)}&roomType=${encodeURIComponent(targetRoom.type || 'General')}&role=Admin&userName=${encodeURIComponent(adminGatewayData.adminName)}`;
          }, 1000);
        }, 1000);
      };
const handleGuestJoin = async (e) => {
  e.preventDefault();

  if (!guestJoinData.roomId || !guestJoinData.secureKey || !loggedInUser) {
    setGuestJoinStatus("Please enter the Room ID and passcode.");
    return;
  }

  try {
    const user = window.firebaseAuth?.currentUser;

    if (!user) {
      setGuestJoinStatus("You must be logged in.");
      return;
    }

    setGuestJoinStatus("Verifying room access...");

    // Get Firebase authentication token
    const idToken = await user.getIdToken();

    // Send Room ID + passcode to the secure Node.js endpoint
    const response = await fetch("/api/rooms/verify", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${idToken}`
      },
      body: JSON.stringify({
        roomId: guestJoinData.roomId.trim(),
        secureKey: guestJoinData.secureKey.trim()
      })
    });

    const result = await response.json();

    console.log("Room verification result:", result);

    if (!response.ok || !result.success) {
      setGuestJoinStatus(
        result.message || "Room verification failed."
      );
      return;
    }

    setGuestJoinStatus("Passcode verified! Joining room...");

    const room = result.room;

    // Build the room.html URL
    const roomUrl =
      `room.html?roomId=${encodeURIComponent(room.roomId)}` +
      `&roomName=${encodeURIComponent(room.name || "Voice Room")}` +
      `&roomType=${encodeURIComponent((room.type || "family").toLowerCase())}` +
      `&role=Guest` +
      `&userName=${encodeURIComponent(loggedInUser)}`;

    window.location.href = roomUrl;

  } catch (error) {
    console.error("Guest join error:", error);

    setGuestJoinStatus(
      "Could not connect to the room verification server."
    );
  }
};
      const handleApplyCoupon = (e) => {
        e.preventDefault();
        if (!couponCode) return;
        if (couponCode.toUpperCase() === 'TALKIE20') {
          setDiscountApplied(true);
          setCouponStatus('Coupon applied successfully! 20% discount unlocked.');
        } else {
          setCouponStatus('Invalid coupon code. Try "TALKIE20".');
        }
      };

      const handleSupportSubmit = (e) => {
        e.preventDefault();
        if (!supportForm.subject || !supportForm.message) return;
        setSupportSubmitted(true);
        setTimeout(() => {
          setSupportSubmitted(false);
          setIsSupportOpen(false);
          setSupportForm({ subject: '', message: '' });
        }, 1500);
      };

      const handleUpdateManagedRoom = (e) => {
        e.preventDefault();
        if (!managingRoom) return;
        setManagedRooms(prev => prev.map(room => room.roomId === managingRoom.roomId ? managingRoom : room));
        setManagingRoom(null);
      };

      const filteredManagedRooms = managedRooms.filter(r => 
        r.name.toLowerCase().includes(searchQueryRooms.toLowerCase()) || 
        r.roomId.toLowerCase().includes(searchQueryRooms.toLowerCase())
      );

      const filteredRoomHistory = roomHistory.filter(h =>
        (h.name && h.name.toLowerCase().includes(searchQueryHistory.toLowerCase())) ||
        (h.userName && h.userName.toLowerCase().includes(searchQueryHistory.toLowerCase())) ||
        (h.email && h.email.toLowerCase().includes(searchQueryHistory.toLowerCase()))
      );

      const emailQueryMatch = searchQueryHistory.trim().toLowerCase();
      const isEmailQuery = emailQueryMatch.includes('@');
      const matchingRoomsCountByEmail = isEmailQuery 
        ? roomHistory.filter(h => h.email && h.email.toLowerCase() === emailQueryMatch).length 
        : 0;

      return (
        <div className="min-h-screen bg-dark-900 flex flex-col justify-between selection:bg-brand-500 selection:text-white relative">
          
          {copyToast && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-brand-600 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-xl border border-brand-400/30 animate-bounce">
              {copyToast}
            </div>
          )}

          <header className="fixed top-0 w-full z-50 bg-dark-800/85 backdrop-blur-md border-b border-dark-border pt-safe">
            <div className="h-16 px-5 flex items-center justify-between max-w-lg mx-auto">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-brand-500/25">
                  <span className="material-symbols-outlined text-white text-xl">settings_input_antenna</span>
                </div>
                <span className="font-extrabold tracking-tight text-lg text-white">TALKIE TALKIE</span>
              </div>
              
              <div className="flex items-center gap-3">
                <button 
                  onClick={handleLogout}
                  className="h-9 px-3 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 flex items-center gap-1.5 text-rose-400 text-xs font-semibold transition-colors cursor-pointer"
                  title="Logout"
                >
                  <span className="material-symbols-outlined text-base">logout</span>
                  <span>Logout</span>
                </button>

                <button 
                  onClick={() => setIsSupportOpen(true)}
                  className="w-9 h-9 rounded-xl bg-dark-700/60 hover:bg-dark-700 border border-dark-border flex items-center justify-center text-slate-300 transition-colors cursor-pointer"
                  title="General Support"
                >
                  <span className="material-symbols-outlined text-lg">support_agent</span>
                </button>

                <div className="relative">
                  <button 
                    onClick={() => setIsNotificationsOpen(!isNotificationsOpen)}
                    className="w-9 h-9 rounded-xl bg-dark-700/60 hover:bg-dark-700 border border-dark-border flex items-center justify-center text-slate-300 relative transition-colors cursor-pointer"
                  >
                    <span className="material-symbols-outlined text-lg">notifications</span>
                    {notifications.some(n => n.unread) && (
                      <span className="absolute top-2 right-2 w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                    )}
                  </button>

                  {isNotificationsOpen && (
                    <div className="absolute right-0 mt-2 w-72 bg-dark-800 border border-dark-border rounded-2xl shadow-2xl p-3 z-50 flex flex-col gap-2">
                      <div className="flex justify-between items-center pb-2 border-b border-dark-border">
                        <span className="text-xs font-bold text-white uppercase tracking-wider">Notifications</span>
                        <button onClick={() => setNotifications(notifications.map(n => ({...n, unread: false})))} className="text-[10px] text-brand-400 hover:underline cursor-pointer">Mark all read</button>
                      </div>
                      <div className="flex flex-col gap-1.5 max-h-60 overflow-y-auto">
                        {notifications.length === 0 ? (
                          <span className="text-xs text-slate-500 text-center py-3">No notifications</span>
                        ) : (
                          notifications.map(n => (
                            <div key={n.id} className={`p-2.5 rounded-xl border ${n.unread ? 'bg-brand-500/10 border-brand-500/20 text-white' : 'bg-dark-900/40 border-dark-border text-slate-300'} flex flex-col gap-1`}>
                              <p className="text-xs">{n.text}</p>
                              <span className="text-[10px] text-slate-500">{n.time}</span>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </header>

          <main className="relative w-full pt-20 pb-28 max-w-lg mx-auto px-4 flex-1">
            <div className="flex flex-col gap-6">
              
              {activeTab === 'home' && (
                <>
                  <div className="flex flex-col gap-3">
                    <div className="flex items-center justify-between">
                      <h2 className="text-xl font-bold tracking-tight text-white">Room Dashboard</h2>
                      <button onClick={() => setIsNewRoomModalOpen(true)} className="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 shadow-md shadow-brand-600/20 transition-all active:scale-95 cursor-pointer">
                        <span className="material-symbols-outlined text-[16px]">add</span> New Room
                      </button>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-3">
                      <button 
                        onClick={() => { 
                          setActiveActionModal('Family'); 
                          setActionFormData({ username: loggedInUser, email: loggedInEmail, roomId: '', secureKey: '' }); 
                        }}
                        className="bg-dark-800 hover:bg-dark-700 border border-dark-border hover:border-brand-500/50 rounded-2xl p-4 flex flex-col gap-3 text-left transition-all active:scale-95 group cursor-pointer"
                      >
                        <div className="w-9 h-9 rounded-xl bg-brand-500/10 border border-brand-500/20 flex items-center justify-center text-brand-400 group-hover:bg-brand-500 group-hover:text-white transition-colors">
                          <span className="material-symbols-outlined text-lg" style={{ fontVariationSettings: "'FILL' 1" }}>family_home</span>
                        </div>
                        <div>

                  <button onClick={() => setIsAdminGatewayOpen(false)} className="text-slate-400 hover:text-white cursor-pointer">
                    <span className="material-symbols-outlined text-xl">close</span>
                  </button>
                </div>

                <p className="text-[11px] text-slate-400">Enter your administrative credentials to securely join your voice room.</p>

                <form onSubmit={handleAdminGatewayJoin} className="flex flex-col gap-3.5">
                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">ADMIN</label>
                    <input 
                      type="text" 
                      value={adminGatewayData.adminName}
                      readOnly
                      className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900/50 text-slate-300 text-sm outline-none cursor-not-allowed select-none" 
                      required 
                    />
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">ROOM NAME</label>
                    <input 
                      type="text" 
                      placeholder="e.g. BraveNode507's Room" 
                      className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900 text-white text-sm outline-none focus:border-amber-500" 
                      value={adminGatewayData.roomId} 
                      onChange={e => setAdminGatewayData({...adminGatewayData, roomId: e.target.value})} 
                      required 
                    />
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">ROOM ID / PASSCODE</label>
                    <input 
                      type="password" 
                      placeholder="Enter secure passcode" 
                      className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900 text-white text-sm outline-none focus:border-amber-500" 
                      value={adminGatewayData.secureKey} 
                      onChange={e => setAdminGatewayData({...adminGatewayData, secureKey: e.target.value})} 
                      required 
                    />
                  </div>

                  {adminGatewayStatus && (
                    <div className="p-2 bg-amber-500/10 border border-amber-500/30 rounded-xl text-center text-[11px] text-amber-300 font-medium animate-pulse">
                      {adminGatewayStatus}
                    </div>
                  )}

                  <button type="submit" className="w-full bg-amber-600 hover:bg-amber-500 text-white py-3 rounded-xl font-bold text-xs mt-2 shadow-lg shadow-amber-600/25 transition-all cursor-pointer flex items-center justify-center gap-1.5">
                    <span className="material-symbols-outlined text-sm">vpn_key</span> Verify &amp; Join Voice Room
                  </button>
                </form>
              </div>
            </div>
          )}

          {activeActionModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-dark-800 border border-dark-border rounded-3xl p-6 w-full max-w-sm flex flex-col gap-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <span className="material-symbols-outlined text-brand-400">
                      {activeActionModal === 'Family' ? 'family_home' : 'domain'}
                    </span>
                    Create {activeActionModal} Room
                  </h3>
                  <button onClick={() => setActiveActionModal(null)} className="text-slate-400 hover:text-white cursor-pointer">
                    <span className="material-symbols-outlined text-xl">close</span>
                  </button>
                </div>

                <form onSubmit={handleCreateRoomWithDetails} className="flex flex-col gap-3.5">
                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">User Name</label>
                    <input 
                      type="text" 
                      value={loggedInUser} 
                      readOnly
                      className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900/50 text-slate-300 text-sm outline-none cursor-not-allowed select-none" 
                      required 
                    />
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Email Address</label>
                    <input 
                      type="email" 
                      value={loggedInEmail} 
                      readOnly
                      className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900/50 text-slate-300 text-sm outline-none cursor-not-allowed select-none" 
                      required 
                    />
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">ROOM NAME</label>
                    <input 
                      type="text" 
                      placeholder="e.g. BraveNode507's Business Room" 
                      className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900 text-white text-sm outline-none focus:border-brand-500" 
                      value={actionFormData.roomId} 
                      onChange={e => setActionFormData({...actionFormData, roomId: e.target.value})} 
                      required 
                    />
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">PASSCODE</label>
                    <input 
                      type="password" 
                      placeholder="Enter secure passcode" 
                      className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900 text-white text-sm outline-none focus:border-brand-500" 
                      value={actionFormData.secureKey} 
                      onChange={e => setActionFormData({...actionFormData, secureKey: e.target.value})} 
                      required 
                    />
                  </div>

                  <button type="submit" className="w-full bg-brand-600 hover:bg-brand-500 text-white py-3 rounded-xl font-bold text-xs mt-2 shadow-lg shadow-brand-600/25 transition-all cursor-pointer">
                    Save &amp; Create Room
                  </button>
                </form>
              </div>
            </div>
          )}

          {isSupportOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-dark-800 border border-dark-border rounded-3xl p-6 w-full max-w-sm flex flex-col gap-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <span className="material-symbols-outlined text-brand-400">support_agent</span>
                    General Support Desk
                  </h3>
                  <button onClick={() => setIsSupportOpen(false)} className="text-slate-400 hover:text-white cursor-pointer">
                    <span className="material-symbols-outlined text-xl">close</span>
                  </button>
                </div>

                {supportSubmitted ? (
                  <div className="py-8 text-center flex flex-col items-center gap-2">
                    <span className="material-symbols-outlined text-emerald-400 text-4xl animate-bounce">check_circle</span>
                    <h4 className="text-sm font-bold text-white">Support Ticket Sent!</h4>
                    <p className="text-xs text-slate-400">Our customer team will get back to you shortly.</p>
                  </div>
                ) : (
                  <form onSubmit={handleSupportSubmit} className="flex flex-col gap-3.5">
                    <div className="flex flex-col gap-1.5">
                      <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Subject</label>
                      <input 
                        type="text" 
                        placeholder="Brief summary of your issue" 
                        value={supportForm.subject}
                        onChange={e => setSupportForm({...supportForm, subject: e.target.value})}
                        className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900 text-white text-sm outline-none focus:border-brand-500"
                        required 
                      />
                    </div>

                    <div className="flex flex-col gap-1.5">
                      <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Message</label>
                      <textarea 
                        rows="3" 
                        placeholder="Describe how we can help you..." 
                        value={supportForm.message}
                        onChange={e => setSupportForm({...supportForm, message: e.target.value})}
                        className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900 text-white text-sm outline-none focus:border-brand-500 resize-none"
                        required 
                      />
                    </div>

                    <button type="submit" className="w-full bg-brand-600 hover:bg-brand-500 text-white py-3 rounded-xl font-bold text-xs mt-2 cursor-pointer shadow-lg">
                      Submit Support Ticket
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {participantsModalRoom && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-dark-800 border border-dark-border rounded-3xl p-6 w-full max-w-sm flex flex-col gap-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <span className="material-symbols-outlined text-brand-400">group</span>
                    Active Participants ({participantsModalRoom.members})
                  </h3>
                  <button onClick={() => setParticipantsModalRoom(null)} className="text-slate-400 hover:text-white cursor-pointer">
                    <span className="material-symbols-outlined text-xl">close</span>
                  </button>
                </div>
                <div className="flex flex-col gap-2 max-h-60 overflow-y-auto">
                  {(participantsModalRoom.participants || [loggedInUser]).map((user, idx) => (
                    <div key={idx} className="bg-dark-900 border border-dark-border rounded-xl p-3 flex items-center justify-between">
                      <div className="flex items-center gap-2.5">
                        <div className="w-7 h-7 rounded-full bg-brand-500/20 text-brand-400 flex items-center justify-center text-xs font-bold">
                          {user.charAt(0)}
                        </div>
                        <span className="text-xs font-semibold text-white">{user}</span>
                      </div>
                    </div>
                  ))}
                </div>
                <button onClick={() => setParticipantsModalRoom(null)} className="w-full bg-dark-700 hover:bg-dark-600 text-white py-2.5 rounded-xl font-semibold text-xs cursor-pointer">Close</button>
              </div>
            </div>
          )}

          {managingRoom && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-dark-800 border border-dark-border rounded-3xl p-6 w-full max-w-sm flex flex-col gap-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <span className="material-symbols-outlined text-brand-400">settings</span>
                    Manage Room
                  </h3>
                  <button onClick={() => setManagingRoom(null)} className="text-slate-400 hover:text-white cursor-pointer">
                    <span className="material-symbols-outlined text-xl">close</span>
                  </button>
                </div>

                <form onSubmit={handleUpdateManagedRoom} className="flex flex-col gap-3.5">
                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">USER NAME</label>
                    <input 
                      type="text" 
                      value={managingRoom.userName || ''} 
                      readOnly
                      className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900/50 text-slate-300 text-sm outline-none cursor-not-allowed select-none" 
                      required 
                    />
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">EMAIL</label>
                    <input 
                      type="email" 
                      value={managingRoom.email || ''} 
                      readOnly
                      className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900/50 text-slate-300 text-sm outline-none cursor-not-allowed select-none" 
                      required 
                    />
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">ROOM NAME</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Delta Command" 
                      className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900 text-white text-sm outline-none focus:border-brand-500" 
                      value={managingRoom.name} 
                      onChange={e => setManagingRoom({...managingRoom, name: e.target.value})} 
                      required 
                    />
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">ROOM PASSCODE</label>
                    <input 
                      type="password" 
                      placeholder="Enter room password" 
                      className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900 text-white text-sm outline-none focus:border-brand-500" 
                      value={managingRoom.secureKey} 
                      onChange={e => setManagingRoom({...managingRoom, secureKey: e.target.value})} 
                      required 
                    />
                  </div>

                  <button type="submit" className="w-full bg-brand-600 hover:bg-brand-500 text-white py-3 rounded-xl font-bold text-xs mt-2 shadow-lg shadow-brand-600/25 transition-all cursor-pointer">
                    Save Changes
                  </button>
                </form>
              </div>
            </div>
          )}

          {isNewRoomModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-dark-800 border border-dark-border rounded-3xl p-6 w-full max-w-sm flex flex-col gap-4 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-bold text-white">Create New Room</h3>
                  <button onClick={() => setIsNewRoomModalOpen(false)} className="text-slate-400 hover:text-white cursor-pointer">
                    <span className="material-symbols-outlined text-xl">close</span>
                  </button>
                </div>
                <form onSubmit={handleCreateRoom} className="flex flex-col gap-3.5">
                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Room Name</label>
                    <input type="text" placeholder="e.g. BraveNode507's Business Room" className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900 text-white text-sm outline-none focus:border-brand-500" value={newRoomData.name} onChange={e => setNewRoomData({...newRoomData, name: e.target.value})} required />
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Room Category Type</label>
                    <select className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900 text-white text-sm outline-none focus:border-brand-500" value={newRoomData.type} onChange={e => setNewRoomData({...newRoomData, type: e.target.value})}>
                      <option value="Family">Family Room</option>
                      <option value="Business">Business Room</option>
                    </select>
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Email Address</label>
                    <input 
                      type="email" 
                      value={loggedInEmail} 
                      readOnly
                      className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900/50 text-slate-300 text-sm outline-none cursor-not-allowed select-none" 
                      required 
                    />
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">PASSCODE</label>
                    <input type="password" placeholder="Enter secure passcode" className="w-full px-4 py-3 rounded-xl border border-dark-border bg-dark-900 text-white text-sm outline-none focus:border-brand-500" value={newRoomData.secureKey} onChange={e => setNewRoomData({...newRoomData, secureKey: e.target.value})} required />
                  </div>

                  <button type="submit" className="w-full bg-brand-600 hover:bg-brand-500 text-white py-3 rounded-xl font-bold text-xs mt-2 cursor-pointer">Save &amp; Create Room</button>
                </form>
              </div>
            </div>
          )}

          <nav className="fixed bottom-0 w-full z-50 pb-safe bg-dark-800/85 backdrop-blur-md border-t border-dark-border">
            <div className="flex justify-around items-center h-16 px-2 max-w-lg mx-auto">
              <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center justify-center gap-1 w-full transition-colors cursor-pointer ${activeTab === 'home' ? 'text-brand-400 font-semibold' : 'text-slate-400'}`}>
                <span className="material-symbols-outlined text-xl">home</span>
                <span className="text-[10px]">Home</span>
              </button>
              <button onClick={() => setActiveTab('rooms')} className={`flex flex-col items-center justify-center gap-1 w-full transition-colors cursor-pointer ${activeTab === 'rooms' ? 'text-brand-400 font-semibold' : 'text-slate-400'}`}>
                <span className="material-symbols-outlined text-xl">forum</span>
                <span className="text-[10px]">Rooms</span>
              </button>
              <button onClick={() => setActiveTab('payments')} className={`flex flex-col items-center justify-center gap-1 w-full transition-colors cursor-pointer ${activeTab === 'payments' ? 'text-brand-400 font-semibold' : 'text-slate-400'}`}>
                <span className="material-symbols-outlined text-xl">payments</span>
                <span className="text-[10px]">Pay</span>
              </button>
              <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center justify-center gap-1 w-full transition-colors cursor-pointer ${activeTab === 'profile' ? 'text-brand-400 font-semibold' : 'text-slate-400'}`}>
                <span className="material-symbols-outlined text-xl">account_circle</span>
                <span className="text-[10px]">Profile</span>
              </button>
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
