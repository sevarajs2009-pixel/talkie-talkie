<script>
  // Password Visibility Toggle
  const toggleBtn = document.getElementById('toggle-password');
  const passwordInput = document.getElementById('password');

  if (toggleBtn && passwordInput) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      const icon = toggleBtn.querySelector('.material-symbols-outlined');
      if (icon) {
        icon.textContent = isPassword ? 'visibility' : 'visibility_off';
      }
    });
  }

  // Check Username Availability Function
  function checkUsernameAvailability() {
    const usernameInput = document.getElementById('username').value.trim();
    const statusDiv = document.getElementById('username-status');

    if (!usernameInput) {
      statusDiv.innerHTML = `<span class="material-symbols-outlined text-[16px] text-error">error</span><span class="text-error">Please enter a username first.</span>`;
      return;
    }

    // Checking if the entered username is "Kumar" (case-insensitive)
    if (usernameInput.toLowerCase() === 'kumar') {
      statusDiv.innerHTML = `<span class="material-symbols-outlined text-[16px] text-error">error</span><span class="text-error">This is already taken. Try a different one or click Suggest.</span>`;
    } else {
      statusDiv.innerHTML = `<span class="material-symbols-outlined text-[16px] text-[#2e7d32]">check_circle</span><span class="text-[#2e7d32]">Username is available!</span>`;
    }
  }

  // Generate Unique Username Function
  function generateUniqueUsername() {
    const adjectives = ['Swift', 'Cosmic', 'Brave', 'Neon', 'Bold', 'Silent', 'Lunar', 'Alpha', 'Epic', 'Nova'];
    const nouns = ['Talker', 'Speaker', 'Vibe', 'Echo', 'Voice', 'Wave', 'Pulse', 'Node', 'Chatter', 'Link'];
    const randomAdj = adjectives[Math.floor(Math.random() * adjectives.length)];
    const randomNoun = nouns[Math.floor(Math.random() * nouns.length)];
    const randomNum = Math.floor(100 + Math.random() * 900);
    const uniqueName = `${randomAdj}${randomNoun}${randomNum}`;
    document.getElementById('username').value = uniqueName;
    
    // Automatically clear or set success state when suggestion is clicked
    document.getElementById('username-status').innerHTML = `<span class="material-symbols-outlined text-[16px] text-[#2e7d32]">check_circle</span><span class="text-[#2e7d32]">Username is available!</span>`;
  }

  // Handle Sign Up Submission
 
</script>
